name: Publish Telegram Admin Manager v4.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4.2.8.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Build v4.2.8 from verified v4.2.7 package
        shell: bash
        run: |
          set -euo pipefail
          OLD=4.2.7
          NEW=4.2.8
          OLD_ZIP="TelegramAdminManager_v${OLD}_update.zip"
          NEW_ZIP="TelegramAdminManager_v${NEW}_update.zip"
          OLD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${OLD}/${OLD_ZIP}"

          rm -rf build extracted package "$OLD_ZIP" "$NEW_ZIP"
          mkdir -p extracted package
          curl -fL --retry 3 --retry-delay 2 "$OLD_URL" -o "$OLD_ZIP"
          unzip -q "$OLD_ZIP" -d extracted

          SRC_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$SRC_DIR"
          mkdir -p "package/TelegramAdminManager-${NEW}"
          cp -a "$SRC_DIR"/. "package/TelegramAdminManager-${NEW}/"

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('package/TelegramAdminManager-4.2.8/telegram_admin_manager.py')
          text = p.read_text(encoding='utf-8')
          text2, n = re.subn(r'APP_VERSION\s*=\s*["\']4\.2\.7["\']', 'APP_VERSION = "4.2.8"', text, count=1)
          if n != 1:
              raise SystemExit('Could not bump APP_VERSION 4.2.7 -> 4.2.8')
          p.write_text(text2, encoding='utf-8')
          PY

          python -m py_compile "package/TelegramAdminManager-${NEW}/telegram_admin_manager.py"
          python -m py_compile "package/TelegramAdminManager-${NEW}/tam_core/updater.py"

          (cd package && zip -qr "../${NEW_ZIP}" "TelegramAdminManager-${NEW}")
          SHA256="$(sha256sum "$NEW_ZIP" | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "NEW_ZIP=$NEW_ZIP" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.2.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v4.2.8 "$NEW_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v4.2.8 "$NEW_ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Telegram Admin Manager v4.2.8" \
              --notes "Second automatic-update test: v4.2.7 -> v4.2.8. No functional changes."
          fi

      - name: Publish manifest only after release exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<PY
          import json
          data = {
              'version': '4.2.8',
              'package_url': 'https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.2.8/TelegramAdminManager_v4.2.8_update.zip',
              'sha256': '${SHA256}',
              'notes': 'Второй тест автообновления: переход с v4.2.7 на v4.2.8. Функциональных изменений нет.'
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "Manifest already current"
          else
            git commit -m "Publish Telegram Admin Manager 4.2.8"
            git push
          fi

      - name: Verify published manifest and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v4.2.8 --repo "$GITHUB_REPOSITORY" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('update.json').read_text(encoding='utf-8'))
          assert d['version'] == '4.2.8'
          assert len(d['sha256']) == 64
          print('Publication verified:', d['version'], d['sha256'])
          PY
