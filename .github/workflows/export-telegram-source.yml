name: Export Telegram 4.2.9 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-telegram-source.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-telegram-source.yml'
      - 'docs/superpowers/**'
      - 'release-src/4.3.0/**'
      - 'release.json'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Download and verify 4.2.9 release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/youngcitizencosmopolitan/telegram-admin-manager-updates/releases/download/v4.2.9/TelegramAdminManager_v4.2.9_update.zip'
          Invoke-WebRequest -Uri $url -OutFile 'TelegramAdminManager_v4.2.9_update.zip'
          $actual = (Get-FileHash 'TelegramAdminManager_v4.2.9_update.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'af13a5328b8487d0eaf5ef80345e50c453bc4372179dd2199a122cb8b135346e'
          if ($actual -ne $expected) { throw "SHA mismatch: expected $expected got $actual" }
          New-Item -ItemType Directory -Force -Path export | Out-Null
          Expand-Archive 'TelegramAdminManager_v4.2.9_update.zip' -DestinationPath export -Force
          Get-ChildItem export -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: telegram-admin-manager-4.2.9-source
          path: export/**
          if-no-files-found: error
          retention-days: 1
